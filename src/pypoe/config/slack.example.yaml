# PyPoe lab-integration config (committed template).
#
# Copy this file to `slack.yaml` (gitignored) at the same location and
# adjust for your lab. Settings here are read by `pypoe.lab.*` modules
# at process start (slack bot, web app's /alerts/kuma, MCP server,
# `pypoe lab-status` CLI). PyPoe's own Slack bot settings (bot token,
# signing secret) stay in `.env`, not here.
#
# Precedence (highest wins):
#   1. Explicit kwargs in code (rarely used outside tests).
#   2. Environment variables (LAB_API_URL, LAB_SLACK_CHANNEL,
#      LAB_SLACK_COMMAND_PREFIX, LAB_ALERT_MAX_CONCURRENT,
#      LAB_MCP_AGENT_SOURCE, LAB_MCP_HTTP_TIMEOUT,
#      LAB_CONSULT_ENABLED, LAB_CONSULT_MODELS).
#   3. Values below.
#   4. Built-in defaults.
#
# See PyPoe/docs/LAB_INTEGRATION.md for the full reference.

lab:
  # Lab dashboard base URL (ac-organic-lab web on :8000; proxies /api/*
  # to the FastAPI aggregator). Used by every lab module.
  api_url: http://localhost:8000

  slack:
    # Channel that Kuma alerts and `ask_human` post into. Must exist
    # and the PyPoe bot must be a member.
    alert_channel: "#lab-alerts"

    # Namespace prefix for the slash commands. Each lab in a shared
    # workspace should pick its own prefix so the command names don't
    # collide. The bot registers <prefix>{status,device,runs,sensors,
    # actions}. Must start with "/" and end with "-" (or any separator
    # that produces valid Slack command names).
    command_prefix: /lab-

  alerts:
    # Cap on simultaneous `codex exec` investigations from /alerts/kuma.
    # Survives alert storms; raise if you have lots of monitors.
    max_concurrent_investigations: 2

    # Model for the investigator itself — runs on the local Codex CLI
    # (your Codex login), NOT Poe. Pinned so it doesn't drift tiers.
    investigation_model: gpt-5.6-luna
    investigation_reasoning_effort: max

    # Hard wallclock cap (seconds) per investigation; a hung CLI is killed.
    investigation_timeout_s: 300

  mcp:
    # Stamped into the `extra.source` of every observation that
    # `append_observation()` writes. Useful to filter the dashboard's
    # history sidebar by who wrote it.
    agent_source: claude-agent

    # HTTP read timeout (seconds) for aggregator calls. 10s is the
    # default; raise if a device's /status is slow (e.g. OpenLab WMI).
    http_timeout_s: 10

  consult:
    # When true, every /alerts/kuma investigation MUST ask each Poe
    # model below for a second opinion and synthesise their responses
    # into the threaded Slack reply. Set to false (or leave `models`
    # empty) to keep Claude solo.
    enabled: true

    # Poe models to consult during an investigation (Poe-hosted, reached
    # via POE_API_KEY — distinct from the local-CLI investigator above).
    # Each model is called once per investigation. Names must match an
    # entry in src/pypoe/config/models.yaml (chat_models list).
    models:
      - z-ai/glm-5.2
      - deepseek/deepseek-v4-flash-0731

  assistant:
    # Self-healing monitor for the SDL assistant (the dashboard bubble backed
    # by the ac-organic-lab API + OpenRouter). When enabled, a background task
    # probes the assistant health endpoint every `probe_interval_s` seconds.
    # On a DOWN transition it posts a Slack alert, tries common fixes (start /
    # bounce the backing API service, verify the OpenRouter key is present),
    # and posts a threaded report of what succeeded vs failed; recovery posts a
    # :white_check_mark: line. You can also trigger a self-heal on demand by
    # POSTing to /alerts/assistant.
    #
    # The backing service is relaunched WITHOUT sudo: it runs as this user with
    # Restart=on-failure, so a SIGKILL of its MainPID is enough to bounce it.
    monitor_enabled: false

    # Assistant health endpoint (the direct API port, bypassing the web proxy,
    # so a proxy/web fault and an API fault are distinguishable).
    health_url: http://127.0.0.1:8001/api/assistant/health

    # How often (seconds) to probe.
    probe_interval_s: 60

    # systemd unit to start/bounce when the assistant is unhealthy.
    service_name: ac-organic-lab-api.service

    # Repo root whose .env we check for ASSISTANT_OPENAI_API_KEY presence.
    env_root: /home/sdl2/caoyang/ac-organic-lab

    # Seconds to wait after a restart before re-probing.
    restart_wait_s: 10

    # Consecutive failing probes before an alert fires (damp flapping).
    failures_to_alert: 1

  dashboard:
    # Self-healing monitor for the SDL dashboard's *data* routes. /api/health
    # only proves the server is awake — a stale or half-broken deploy (e.g. an
    # unresolved return annotation that 500s /api/openapi.json while health
    # stays green) can break the UI-bearing routes that health never touches.
    # When enabled, a background task probes `paths` under `base_url` every
    # `probe_interval_s` seconds and treats any non-`expected_status` (or a
    # transport error / non-JSON body) as DOWN. On a DOWN transition it posts a
    # Slack alert, bounces the backing API service, re-probes, and posts a
    # threaded report of what succeeded vs failed; recovery posts a
    # :white_check_mark: line. You can trigger a self-heal on demand by POSTing
    # to /alerts/dashboard.
    #
    # The backing service is relaunched WITHOUT sudo: it runs as this user with
    # Restart=on-failure, so a SIGKILL of its MainPID is enough to bounce it.
    monitor_enabled: false

    # Direct API base URL (bypassing the Next proxy, so a web fault is not
    # mistaken for an API fault — matching the assistant monitor).
    base_url: http://127.0.0.1:8001

    # Data routes to probe. All must return expected_status to be healthy.
    paths:
      - /api/openapi.json
      - /api/catalog
      - /api/equipment

    # How often (seconds) to probe.
    probe_interval_s: 120

    # systemd unit to start/bounce when any probed route is unhealthy.
    service_name: ac-organic-lab-api.service

    # Seconds to wait after a restart before re-probing.
    restart_wait_s: 10

    # Status code every probed route must return to be considered healthy.
    expected_status: 200

    # Consecutive failing probes before an alert fires (damp flapping).
    failures_to_alert: 1

