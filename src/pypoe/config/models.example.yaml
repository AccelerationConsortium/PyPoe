# PyPoe chat-model catalog (committed template).
#
# Copy to `models.yaml` in this same directory and edit when a provider's
# model menu changes. Loaded by `pypoe.core.models` at import time;
# `CHAT_MODELS`, `DEFAULT_CHAT_MODEL`, `MODEL_PROVIDERS`, and
# `MODEL_PRICING_USD_PER_1M_TOKENS` are derived from this file.
#
# If `models.yaml` is missing, the loader falls back to the hardcoded
# values inside `pypoe.core.models` (in step with the snapshot below).
# OpenRouter choices refresh automatically from /models/user when a key is set.
# Set PYPOE_OPENROUTER_AUTO_REFRESH_MODELS=false for a fixed YAML roster.
# Tip: run `scripts/utils/update_models.py` to test which models are
# currently live on Poe before editing this list.
#
# ---------------------------------------------------------------------------
# PROVIDERS
# ---------------------------------------------------------------------------
# Each entry may be either form:
#
#   - Claude-Opus-4.8                          # bare string => Poe
#   - {id: anthropic/claude-opus-4.8, provider: openrouter}
#
# Routing is per model, so Poe and OpenRouter models can be used side by side
# (including as the two sides of a debate). Supported providers and the key
# each one needs:
#
#   poe         POE_API_KEY          https://poe.com/api_key
#   openrouter  OPENROUTER_API_KEY   https://openrouter.ai/keys
#
# A provider with no key configured is simply skipped — its models will report
# a clear "not configured" error if selected, and /status omits it rather than
# calling it unhealthy.
#
# Billing note: Poe is a flat subscription; OpenRouter is pay-per-token.
# PYPOE_OPENROUTER_MAX_TOKENS (default 4096) caps every OpenRouter completion,
# and PYPOE_OPENROUTER_MIN_CREDITS (default 1.0 USD) is the balance below which
# /status reports OpenRouter degraded — before requests start failing.
#
# Pricing snapshot from https://models.poecdn.net/models.json (displayed
# by https://poe.com/api/models). Values are USD per 1M tokens.
# OpenRouter publishes live per-token pricing at
# https://openrouter.ai/api/v1/models (multiply by 1e6 for this table).

# The model new chats use by default. It may belong to either provider — make
# sure that provider's key is set, or every default chat fails at the first
# request. GLM-5.2 is carried by both Poe and OpenRouter; the OpenRouter route
# (`z-ai/glm-5.2`) is ~12.6x cheaper with a 1M context, and is the only one
# reachable while the Poe subscription is lapsed.
default: z-ai/glm-5.2

chat_models:
  # --- OpenRouter (pay-per-token) — the two working models ---
  - {id: z-ai/glm-5.2, provider: openrouter}
  - {id: deepseek/deepseek-v4-flash-0731, provider: openrouter}

  # --- Poe (flat subscription; the only provider with image/video bots) ---
  - Claude-Opus-4.8
  - Claude-Sonnet-4.6
  - Claude-Opus-4.7
  - Grok-4
  - Gemini-3.1-Pro
  - Gemini-3-Flash
  - Kimi-K3

  # --- More OpenRouter models (pay-per-token) ---
  # Ids must match OpenRouter's slugs exactly — see https://openrouter.ai/models.
  # - {id: anthropic/claude-opus-4.8,   provider: openrouter}
  # - {id: anthropic/claude-sonnet-4.5, provider: openrouter}
  # - {id: openai/gpt-4o,               provider: openrouter}
  # - {id: google/gemini-2.0-flash-001, provider: openrouter}

pricing_usd_per_1m_tokens:
  # OpenRouter live pricing from https://openrouter.ai/api/v1/models,
  # read 2026-08-08. Context window 1,048,576 tokens.
  z-ai/glm-5.2:                    { prompt: 0.1120,  completion: 0.3520   }
  deepseek/deepseek-v4-flash-0731: { prompt: 0.0900,  completion: 0.1800   }

  # Snapshot from https://models.poecdn.net/models.json on 2026-07-19.
  # Every model below is live on Poe and priced from that feed.
  Claude-Opus-4.8:    { prompt: 4.2929,  completion: 21.4646  }
  Claude-Sonnet-4.6:  { prompt: 2.5758,  completion: 12.8788  }
  Claude-Opus-4.7:    { prompt: 4.2929,  completion: 21.4646  }
  Grok-4:             { prompt: 3.0303,  completion: 15.1515  }
  Gemini-3.1-Pro:     { prompt: 2.0202,  completion: 12.1212  }
  Gemini-3-Flash:     { prompt: 0.4040,  completion: 2.4242   }
  # Kimi-K3 is a live Poe bot (https://poe.com/Kimi-K3) but not yet in the
  # models.json pricing feed → left unpriced ("price unknown") until it lands.

  # OpenRouter pricing (USD per 1M tokens), as of 2026-08-08. Uncomment
  # alongside the models above.
  # anthropic/claude-opus-4.8:   { prompt: 5.0,  completion: 25.0 }
  # anthropic/claude-sonnet-4.5: { prompt: 3.0,  completion: 15.0 }
  # openai/gpt-4o:               { prompt: 2.5,  completion: 10.0 }
