[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pypoe"
version = "3.0.0"
description = "Python client for Poe.com using the official API"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.8"
dependencies = [
    "fastapi_poe>=0.0.36",
    "aiosqlite>=0.19.0",
    "python-dotenv>=1.0.0",
    "click>=8.0.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Default install (pip install pypoe) ships the core SDK, database, and CLI
# entry point. Interfaces (web, slack) are opt-in, and media auto-download
# is its own opt-in to avoid pulling aiohttp onto chat-only deployments.

# Web + Slack interfaces
# pip install pypoe[web-ui]
web-ui = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.6",
    "slack-bolt>=1.18.1",
    "slack-sdk>=3.26.2",
    "aiohttp>=3.9.0",  # Required by slack_bolt.async_app / Socket Mode
]

# Media auto-download support (images/videos)
# Requires PYPOE_ENABLE_MEDIA=true at runtime as well.
# pip install pypoe[media]
media = [
    "aiohttp>=3.9.0",
]

# AC Organic Self-driving Lab integration: read-only MCP server,
# Slack /lab-* commands, Uptime Kuma alert routes. Talks to the
# ac-organic-lab aggregator (port 8001) over HTTP only — no /control/*.
# pip install pypoe[lab]
lab = [
    "mcp>=1.2.0",
    "httpx>=0.27",
    "slack-sdk>=3.27",  # explicit; slack-bolt would otherwise be required
    "pyyaml>=6.0",      # parses slack.yaml (lab config)
]

# Development
# pip install pypoe[dev]
dev = [
    "pypoe[web-ui]",
    "pypoe[media]",
    "pypoe[lab]",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[project.scripts]
pypoe = "pypoe.core.cli:run"

[project.urls]
Homepage = "https://github.com/your-username/pypoe"
Repository = "https://github.com/your-username/pypoe"
Issues = "https://github.com/your-username/pypoe/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pypoe*"]

# Only bundle the web assets that the installed package needs at runtime.
# Ops scripts, examples and docs live at the repo root and are not packaged.
[tool.setuptools.package-data]
"pypoe.interfaces.web" = ["static/**/*", "templates/**/*"]
